
name: Build Incredible Option APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - "app/src/main/res/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android WebView project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/incredibleoption app/src/main/res/values
          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "IncredibleOption"
          include(":app")
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.incredibleoption'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.incredibleoption'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '1.4'
              }
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Incredible Option"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          cat > app/src/main/java/com/incredibleoption/MainActivity.java <<'JAVA'
          package com.incredibleoption;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("https://incredibleoption.streamlit.app");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA

      - name: Verify exact supplied logo and launcher resources
        run: |
                - name: Verify supplied launcher logo
        run: |
          test -f app/src/main/res/drawable-nodpi/ic_launcher.png app/src/main/res/drawable-nodpi/incredible_option_logo.png
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
                - name: Verify supplied launcher logo
        run: |
                - name: Verify supplied launcher logo
        run: |
          test -f app/src/main/res/drawable-nodpi/ic_launcher.png app/src/main/res/drawable-nodpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
                - name: Verify supplied launcher logo
        run: |
          test -f app/src/main/res/drawable-nodpi/ic_launcher.png app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Incredible-Option-APK-v1.4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
